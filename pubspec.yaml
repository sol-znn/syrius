name: zenon_syrius_wallet_flutter
description: Zenon cross-platform non-custodial wallet
publish_to: none

environment:
  sdk: '>=3.12.0'

dependencies:
  ai_barcode_scanner: ^7.1.0
  app_links: ^7.0.0
  auto_size_text: ^3.0.0
  big_decimal: ^0.7.0
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  clipboard_watcher: ^0.3.0
  collection: ^1.17.0
  # Ed25519 for the wallet's keys (lib/utils/background_crypto.dart). The
  # version the SDK already resolves to, pinned.
  cryptography: 2.9.0
  desktop_drop: ^0.7.0
  device_info_plus: ^12.3.0
  dotted_border: ^3.1.0
  equatable: ^2.0.5
  expandable: ^5.0.1
  ffi: ^2.1.0
  file_selector: ^1.0.0
  # Use this commit for now because it solves a UI issue, to be updated when version > 1.2.0
  fl_chart:
    git:
      url: https://github.com/imaNNeo/fl_chart.git
      ref: f3a575827312b8f12628b66d12d08066eb4d2570
  flip_card: ^0.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_flip_card: ^0.0.5
  flutter_localizations:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.0+1
  flutter_vector_icons: ^2.0.0
  get_it: ^8.3.0
  hex: ^0.2.0
  hive_ce: ^2.19.3
  hydrated_bloc: ^11.0.0
  image: ^4.0.10
  infinite_scroll_pagination: ^4.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_rpc_2: ^4.0.0
  launch_at_startup: ^0.5.1
  layout: ^1.0.2
  local_notifier: ^0.1.5
  logging: ^1.2.0
  lottie: ^3.1.2
  marquee_widget: ^1.2.0
  mutex: ^3.1.0
  nested: ^1.0.0
  number_selector: ^1.0.5
  open_filex: ^4.3.2
  overlay_support: ^2.1.0
  package_info_plus: ^9.0.0
  path: ^1.8.2
  path_provider: ^2.1.0
  pretty_qr_code: ^3.2.1
  provider: ^6.0.2
  reown_walletkit: ^1.4.0
  retry: ^3.1.2
  rxdart: ^0.28.0
  screen_capturer: ^0.2.3
  share_plus: ^12.0.1
  stacked: ^3.4.1
  stream_transform: ^2.1.0
  tray_manager: ^0.5.2
  url_launcher: ^6.1.12
  validators: ^3.0.0
  version: ^3.0.0
  wakelock_plus: ^1.1.1
  win32: ^5.9.0
  window_manager: ^0.5.1
  znn_ledger_dart:
    git:
      url: https://github.com/zenon-network/znn_ledger_dart.git
      ref: v1.0.0
  znn_sdk_dart:
    git:
      url: https://github.com/zenon-network/znn_sdk_dart.git
      ref: v1.0.0
  zxing2: ^0.2.0

  # Material and Cupertino left the SDK at Flutter 3.47. Pinned exactly:
  # material_ui releases about weekly.
  material_ui: 1.6.0
  cupertino_ui: 1.1.2

  # Motion and shaders, chosen in docs/research/modern-flutter-stack.md.
  # Exact pins: this is a wallet, and each of these was read before it
  # was taken. animations 3.x is the line built on material_ui.
  animations: 3.0.0
  flutter_animate: 4.5.2
  flutter_shaders: 0.1.5

dependency_overrides:
  reown_core:
    path: patched_packages/reown_core-1.3.8
  znn_sdk_dart:
    git:
      url: https://github.com/maznnwell/znn_sdk_dart.git
      ref: 16bf294b3e347cb4f9c1f47a7da5d60034724f95

dev_dependencies:
  bdd_widget_test: ^2.1.4
  bloc_test: ^10.0.0
  build_runner: ^2.4.6
  dependency_validator: ^5.0.5
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true

  # The one file at the top of assets/, named rather than the directory:
  # Flutter refuses a shader that sits under a directory listed here.
  assets:
    - assets/community-nodes.json
    - assets/images/
    - assets/i18n/
    - assets/lottie/
    - assets/svg/
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-JetBrainsMono.txt
    - assets/fonts/OFL-NotoSans.txt

  # The plasma mark's glow. See assets/shaders/NOTICE.md.
  shaders:
    - assets/shaders/heatmap.frag
    - assets/shaders/hero_field.frag
    - assets/shaders/plasma_flow.frag

  # The faces of the refreshed interface: Space Grotesk for the interface,
  # JetBrains Mono for amounts, addresses and hashes. Both OFL, licences
  # beside the files.
  #
  # Neither has Arabic, Devanagari or Han. Noto Sans Arabic and Noto Sans
  # Devanagari (OFL, hinted static builds of the notofonts releases 2.013 and
  # 2.007) are bundled as fallbacks, in the three weights the theme asks for.
  # No Chinese face is bundled: 8 to 17 MB. Han comes from the system, in the
  # order kFontFamilyFallback in lib/utils/app_theme.dart names.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    # The mockup-derived 600 face is a subset. Retain the original symbol
    # coverage through a separate fallback alias without copying font files.
    - family: SpaceGroteskCoverage
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
